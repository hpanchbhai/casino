name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  backend:
    name: Backend (FastAPI) checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn[standard] sqlalchemy[asyncio] asyncpg pydantic yfinance pandas python-dotenv black ruff

      - name: Lint (ruff)
        run: ruff check app etl || true

      - name: Format check (black)
        run: black --check app etl

  frontend:
    name: Frontend (Vite) checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json

      - name: Install deps
        working-directory: dashboard
        run: npm ci

      - name: Type/Build
        working-directory: dashboard
        run: |
          npm run build
